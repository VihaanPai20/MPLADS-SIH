services:
  # Backend (FastAPI + ML Engine)
  - type: web
    name: mplads-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: CORS_ORIGINS
        value: https://mplads-sih.onrender.com,http://localhost:5173
      - key: SECRET_KEY
        value: mplads-production-secret-key-change-this

  # Frontend (Vite React Static Site)
  - type: web
    name: mplads-sih
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://mplads-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
